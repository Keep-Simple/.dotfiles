---
# Runs the install command the README prints, on a current macOS, with stdin
# held by the script so any prompt gets EOF and fails the build.
#
# What a green run proves: the one-liner exits 0, asks nothing, and leaves the
# home directory linked. What it does NOT prove:
#
#   - A genuinely fresh Mac. Runners ship Homebrew, so `install_brew` takes its
#     early return; the rosetta / xcode-select branch needs a GUI and is never
#     exercised here.
#   - The real package list. The job swaps the Brewfile for seven formulae and
#     one tap because the runner has ~14 GB free and the full list (137
#     formulae, 29 casks) fills it long before the playbook can fail for an
#     interesting reason. pam-reattach is among the ones cut, so the Touch ID
#     task is only covered on its module-absent branch.
#   - Hands-off on a Mac where sudo needs a password. The runner has
#     passwordless sudo, so ansible.sh drops `-K` and nothing prompts. On a Mac
#     that does need one, `-K` comes back and the one-liner still stops for it.
#   - Anything needing SIP off. yabai's scripting addition and skhd get their
#     config linked and are never started.
#   - Linux, `my run_remote`, or the `update` tag.
#
# If this job starts running out of disk or time, cut the package list, not the
# assertions.

# The badge in the README reads this name, so keep it short.
name: ci

on:
  pull_request:
  push:
    branches:
      - 'macos'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: README install command
    runs-on: macos-latest
    timeout-minutes: 30  # runs take about 7 minutes; this is a hang guard

    steps:
      - uses: actions/checkout@v4

      - name: Slim the checkout
        run: |
          # Every entry is here because a later role needs it to run at all.
          # Trimming this list does not make the job faster, it silently
          # disables whatever role depended on the line you removed.
          cat > roles/packages/files/macos/Brewfile <<'EOF'
          tap "jandedobbeleer/oh-my-posh"  # home of the oh-my-posh formula
          brew "stow"                      # dotfiles role: every symlink
          brew "neovim"                    # nvim role: headless bootstrap
          brew "tmux"                      # dotfiles role: tpm install_plugins
          brew "pre-commit"                # dotfiles role: hook install
          brew "asdf"                      # dotfiles role: tool install
          brew "jq"                        # scripts under ~/.local/bin
          brew "oh-my-posh"                # zsh role: prompt block in .zshrc
          EOF

          # uv is a binary download. The real list compiles Python, Rust and
          # Go, and pulls .NET.
          echo 'uv 0.9.21' > roles/dotfiles/files/all/asdf/.tool-versions

      - name: Commit to a local branch for setup.sh to clone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # The pull request head is detached; setup.sh clones by branch name.
          git checkout -B ci-under-test
          # --allow-empty: a pull request that already carries this exact
          # Brewfile makes the slim step a no-op, and a bare commit would
          # fail the job for the wrong reason.
          git commit -am 'ci: slim the package list' --allow-empty

      - name: Reset $HOME to fresh-Mac conditions
        run: |
          # The runner image ships a populated home (~/.gitconfig, among
          # others). A fresh Mac does not, and stow refuses to clobber a real
          # file. Remove only the plain files this repo is about to link over,
          # so the job fails on stow bugs and not on the image.
          find roles/dotfiles/files/all roles/dotfiles/files/os_Darwin \
               -mindepth 2 \( -type f -o -type l \) -print |
            sed -E 's#^roles/dotfiles/files/(all|os_Darwin)/[^/]+/##' |
            while read -r rel; do
              if [ -f "$HOME/$rel" ] && [ ! -L "$HOME/$rel" ]; then
                echo "removing pre-existing $HOME/$rel"
                rm -f "$HOME/$rel"
              fi
            done

          # The image runs `defaults write com.apple.screensaver idleTime 0`,
          # which stores a string. osx_defaults refuses to change a key whose
          # stored type differs from the declared one. A fresh Mac does not
          # have the key at all. Add to this list if another default trips the
          # same "Type mismatch" error.
          defaults delete com.apple.screensaver idleTime 2>/dev/null || true

      - name: Run the README install command
        # `shell: bash` for pipefail. Without it the tee swallows the script's
        # exit code and every install passes.
        shell: bash
        env:
          # setup.sh clones this into ~/.dotfiles, and the repo role's clone of
          # dotfiles.repo into the same path is a no-op (update: false). So the
          # whole playbook runs against the pull request, not against macos.
          source: ${{ github.workspace }}
          branch: ci-under-test
        # Same shape as the README's pipe. stdin belongs to the script, so
        # anything that tries to read the terminal gets EOF and the job fails.
        run: cat setup.sh | sh -s 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Assert the install kept its promises
        run: |
          set -eu

          resolved=$(readlink -f "$HOME/.zshrc")
          case "$resolved" in
            "$HOME/.dotfiles/"*) ;;
            *) echo "~/.zshrc is not stowed from the repo: $resolved"; exit 1 ;;
          esac

          test -d "$HOME/.local/share/nvim/lazy" || {
            echo 'lazy.nvim did not bootstrap'; exit 1; }

          test -d "$HOME/.tmux/plugins/tpm" || {
            echo 'tpm was not cloned'; exit 1; }

          # The asdf task carries failed_when: false, so a broken plugin add or
          # install is invisible to the exit code. This is the only thing that
          # notices.
          test -d "${ASDF_DATA_DIR:-$HOME/.asdf}/installs/uv" || {
            echo 'asdf did not install uv'; exit 1; }

          # The packages role adds this exact line around `brew bundle` and
          # removes it in an `always` block. Matching the literal rather than
          # grepping for NOPASSWD keeps the check on our own leftovers instead
          # of whatever grants the runner its passwordless sudo.
          # /etc/sudoers is mode 0440, so read it as root. Reading it through
          # a bare `grep` returns "Permission denied" and a non-zero status,
          # which reads as "line not found" and passes the check for the wrong
          # reason.
          sudoers=$(sudo cat /etc/sudoers) || {
            echo 'cannot read /etc/sudoers'; exit 1; }
          echo '--- NOPASSWD lines in /etc/sudoers ---'
          printf '%s\n' "$sudoers" | grep -n NOPASSWD || echo '(none)'
          if printf '%s\n' "$sudoers" | grep -qxF 'ALL ALL=(ALL) NOPASSWD: ALL'; then
            echo '/etc/sudoers still has the packages role NOPASSWD line'
            exit 1
          fi

      # A task that errors on a populated machine fails here rather than on the
      # next `my run`. This does not assert changed=0: several tasks report
      # changed on every run by design, so idempotence is not checkable this way.
      - name: Run the playbook a second time
        shell: bash
        run: ~/.dotfiles/ansible.sh run 2>&1 | tee "$RUNNER_TEMP/rerun.log"

      - name: Check the play recaps
        run: |
          set -eu
          for log in "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/rerun.log"; do
            name=$(basename "$log")
            recap=$(grep -E 'ok=[0-9]+ +changed=' "$log" | tail -1 || true)
            if [ -z "$recap" ]; then
              echo "::error::$name: no PLAY RECAP, the playbook never finished"
              exit 1
            fi
            echo "$name: $recap"
            # failed and unreachable already break the exit code. ignored and
            # rescued do not, so this step is the only thing that sees them.
            for key in failed unreachable ignored rescued; do
              n=$(printf '%s' "$recap" | sed -n "s/.*$key=\([0-9]*\).*/\1/p")
              if [ "${n:-0}" -ne 0 ]; then
                echo "::error::$name: $key=$n"
                exit 1
              fi
            done
          done
          # Visible, but not fatal: ansible warns routinely.
          grep -ho '\[DEPRECATION WARNING\].*\|\[WARNING\].*' \
            "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/rerun.log" 2>/dev/null |
            sort -u | while read -r w; do echo "::warning::$w"; done

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install ansible-lint
      - run: ansible-lint
