---
- name: Close any open System Preferences panes
  ansible.builtin.command:
    cmd: osascript -e 'tell application "System Preferences" to quit'
  changed_when: false

- name: Set macOS default settings
  community.general.osx_defaults:
    domain: "{{ item['domain'] }}"
    key: "{{ item['key'] }}"
    type: "{{ item['type'] | default(omit) }}"
    value: "{{ item['value'] }}"
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item['name'] }}"
  notify: Restart dock

- name: Set macOS default settings from xml files
  ansible.builtin.command:
    cmd: "defaults import {{ item['key'] }} {{ dotfiles.target }}/roles/system_defaults/files/macos/xml_settings/{{ item['filename'] }}"
  loop: "{{ macos_defaults_xml }}"
  loop_control:
    label: "{{ item['key'] }}"
  changed_when: false
  notify: Restart dock

- name: Activate system settings
  ansible.builtin.command:
    cmd: /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
  changed_when: false

- name: Unhide ~/Library
  ansible.builtin.command: "chflags nohidden {{ ansible_facts['user_dir'] }}/Library"
  changed_when: false

- name: Remove extended attributes on ~/Library
  ansible.builtin.command: "xattr -c {{ ansible_facts['user_dir'] }}/Library"
  changed_when: false

- name: Unhide /Volumes
  ansible.builtin.command: chflags nohidden /Volumes
  changed_when: false
  become: true

- name: Enable Touch ID for sudo (with tmux/ssh reattach)
  ansible.builtin.copy:
    dest: /etc/pam.d/sudo_local
    owner: root
    group: wheel
    mode: '0444'
    content: |
      # Managed by ansible (dotfiles). Survives macOS updates.
      auth       optional       {{ homebrew_brew_bin_path | dirname }}/lib/pam/pam_reattach.so ignore_ssh
      auth       sufficient     pam_tid.so
  become: true

- name: Allow passwordless pmset disablesleep (awake-toggle)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/pmset-disablesleep
    owner: root
    group: wheel
    mode: '0440'
    validate: 'visudo -cf %s'
    content: |
      # Managed by ansible (dotfiles). Lets awake-toggle run from a tmux binding.
      {{ ansible_facts['user_id'] }} ALL = (root) NOPASSWD: /usr/bin/pmset -a disablesleep 0, /usr/bin/pmset -a disablesleep 1
  become: true

- name: Hash the yabai binary
  ansible.builtin.stat:
    path: "{{ homebrew_brew_bin_path }}/yabai"
    checksum_algorithm: sha256
    follow: true
  register: yabai_bin

- name: Allow passwordless yabai --load-sa
  ansible.builtin.copy:
    dest: /etc/sudoers.d/yabai
    owner: root
    group: wheel
    mode: '0440'
    validate: 'visudo -cf %s'
    content: |
      # Managed by ansible (dotfiles). The hash is re-read on every run, so a
      # yabai upgrade refreshes it instead of silently breaking --load-sa.
      {{ ansible_facts['user_id'] }} ALL = (root) NOPASSWD: sha256:{{ yabai_bin.stat.checksum }} {{ homebrew_brew_bin_path }}/yabai --load-sa
  when: yabai_bin.stat.exists
  become: true


