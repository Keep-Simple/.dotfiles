# Vim keys built-in: h/j/k/l, gg/G, / search, dd kill, tab switch widget, ? help.
# Custom catppuccin-macchiato palette below.

[flags]
group_processes = false
process_command = true
rate = "500ms"
mem_as_value = false
network_use_binary_prefix = true

[processes]
columns = ["pid", "name", "cpu%", "mem%", "user", "state"]

# Layout: processes (focused) on top, cpu + mem side-by-side on bottom.
[[row]]
ratio = 75
[[row.child]]
type = "proc"
default = true

[[row]]
ratio = 25
[[row.child]]
type = "cpu"
[[row.child]]
type = "mem"

[cpu]
default = "average"

# Catppuccin Macchiato palette
# bg #24273a  mantle #1e2030  surface1 #494d64  text #cad3f5
# blue #8aadf4  teal #8bd5ca  mauve #c6a0f6  lavender #b7bdf8
# green #a6da95  sapphire #7dc4e4  yellow #eed49f
# peach #f5a97f  red #ed8796  overlay0 #6e738d  subtext0 #a5adcb

[styles.cpu]
all_entry_color = "#cad3f5"
avg_entry_color = "#ed8796"
cpu_core_colors = [
    "#8aadf4", "#8bd5ca", "#a6da95", "#eed49f",
    "#c6a0f6", "#7dc4e4", "#f5a97f", "#b7bdf8",
]

[styles.memory]
ram_color = "#8aadf4"
cache_color = "#8bd5ca"
swap_color = "#c6a0f6"
arc_color = "#7dc4e4"
gpu_colors = ["#a6da95", "#eed49f", "#f5a97f"]

[styles.network]
rx_color = "#a6da95"
tx_color = "#ed8796"
rx_total_color = "#7dc4e4"
tx_total_color = "#f5a97f"

[styles.widgets]
border_color = "#494d64"
selected_border_color = "#8aadf4"
widget_title = { color = "#8aadf4", bold = true }
text = "#cad3f5"
selected_text = { color = "#1e2030", bg_color = "#8aadf4", bold = true }
disabled_text = "#6e738d"

[styles.graphs]
graph_color = "#a5adcb"
legend_text = { color = "#cad3f5" }

[styles.tables]
headers = { color = "#8aadf4", bold = true }

[styles.battery]
battery_colors = ["#ed8796", "#f5a97f", "#eed49f", "#a6da95"]
