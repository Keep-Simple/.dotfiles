# Vim keys built-in: h/j/k/l, gg/G, / search, dd kill, tab switch widget, ? help.
# Custom catppuccin-mocha palette below.

[flags]
group_processes = false
process_command = true
rate = "500ms"
mem_as_value = false
network_use_binary_prefix = true

[processes]
columns = ["pid", "name", "cpu%", "mem%", "user", "state"]

# Layout: processes (focused) on top, cpu + mem side-by-side on bottom.
[[row]]
ratio = 75
[[row.child]]
type = "proc"
default = true

[[row]]
ratio = 25
[[row.child]]
type = "cpu"
[[row.child]]
type = "mem"

[cpu]
default = "average"

# Catppuccin Mocha palette
# bg #1e1e2e  mantle #181825  surface1 #45475a  text #cdd6f4
# blue #89b4fa  teal #94e2d5  mauve #cba6f7  lavender #b4befe
# green #a6e3a1  sapphire #74c7ec  yellow #f9e2af
# peach #fab387  red #f38ba8  overlay0 #6c7086  subtext0 #a6adc8

[styles.cpu]
all_entry_color = "#cdd6f4"
avg_entry_color = "#f38ba8"
cpu_core_colors = [
    "#89b4fa", "#94e2d5", "#a6e3a1", "#f9e2af",
    "#cba6f7", "#74c7ec", "#fab387", "#b4befe",
]

[styles.memory]
ram_color = "#89b4fa"
cache_color = "#94e2d5"
swap_color = "#cba6f7"
arc_color = "#74c7ec"
gpu_colors = ["#a6e3a1", "#f9e2af", "#fab387"]

[styles.network]
rx_color = "#a6e3a1"
tx_color = "#f38ba8"
rx_total_color = "#74c7ec"
tx_total_color = "#fab387"

[styles.widgets]
border_color = "#45475a"
selected_border_color = "#89b4fa"
widget_title = { color = "#89b4fa", bold = true }
text = "#cdd6f4"
selected_text = { color = "#181825", bg_color = "#89b4fa", bold = true }
disabled_text = "#6c7086"

[styles.graphs]
graph_color = "#a6adc8"
legend_text = { color = "#cdd6f4" }

[styles.tables]
headers = { color = "#89b4fa", bold = true }

[styles.battery]
battery_colors = ["#f38ba8", "#fab387", "#f9e2af", "#a6e3a1"]
