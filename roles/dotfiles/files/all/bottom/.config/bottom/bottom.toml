# Vim keys built-in: h/j/k/l, gg/G, / search, dd kill, tab switch widget, ? help.
# Custom tokyonight-storm palette below.

[flags]
group_processes = false
process_command = true
rate = "500ms"
mem_as_value = false
network_use_binary_prefix = true

[processes]
columns = ["pid", "name", "cpu%", "mem%", "user", "state"]

# Layout: processes (focused) on top, cpu + mem side-by-side on bottom.
[[row]]
ratio = 75
[[row.child]]
type = "proc"
default = true

[[row]]
ratio = 25
[[row.child]]
type = "cpu"
[[row.child]]
type = "mem"

[cpu]
default = "average"

# Tokyonight Storm palette
# bg #24283b  fg #c0caf5  blue #7aa2f7  cyan #7dcfff  magenta #bb9af7
# purple #9d7cd8  green #9ece6a  teal #73daca  yellow #e0af68
# orange #ff9e64  red #f7768e  comment #565f89

[styles.cpu]
all_entry_color = "#c0caf5"
avg_entry_color = "#f7768e"
cpu_core_colors = [
    "#7aa2f7", "#7dcfff", "#9ece6a", "#e0af68",
    "#bb9af7", "#73daca", "#ff9e64", "#9d7cd8",
]

[styles.memory]
ram_color = "#7aa2f7"
cache_color = "#7dcfff"
swap_color = "#bb9af7"
arc_color = "#73daca"
gpu_colors = ["#9ece6a", "#e0af68", "#ff9e64"]

[styles.network]
rx_color = "#9ece6a"
tx_color = "#f7768e"
rx_total_color = "#73daca"
tx_total_color = "#ff9e64"

[styles.widgets]
border_color = "#3b4261"
selected_border_color = "#7aa2f7"
widget_title = { color = "#7aa2f7", bold = true }
text = "#c0caf5"
selected_text = { color = "#1f2335", bg_color = "#7aa2f7", bold = true }
disabled_text = "#565f89"

[styles.graphs]
graph_color = "#a9b1d6"
legend_text = { color = "#c0caf5" }

[styles.tables]
headers = { color = "#7aa2f7", bold = true }

[styles.battery]
battery_colors = ["#f7768e", "#ff9e64", "#e0af68", "#9ece6a"]
