# Defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -s set-clipboard on

# fix color
set -ag terminal-overrides ",$TERM:RGB"

set-option -g default-shell /bin/zsh
set-option -g default-command 'zsh'
# set -g default-terminal "xterm-kitty"

# top status bar
set-option -g status-position top

# TokyoNight colors for Tmux
# ----- Messages -----
set-option -g mode-style 'bg=blue, fg=black'
set-option -g message-style 'bg=blue, fg=black'

# ----- Center -----
set-option -g status-justify left
set-option -g status-style "bg=black"
set-window-option -g window-status-current-format '#[bold]#[fg=blue, bg=black]#[fg=black, bg=blue]#{?window_zoomed_flag,Z ,}#I:#W#[fg=blue, bg=black]'
set-window-option -g window-status-format '#I:#W'
set-window-option -g window-status-separator ' '
set-window-option -g window-status-style "bg=black"
set-window-option -g window-status-current-style "bg=blue,fg=black"

# ----- Left -----
set-option -g status-left ""


# ----- Right -----
set-option -g status-right " #S #[fg=blue, bg=black]"
set-option -g status-right-style "bg=blue,fg=black"
set-option -g status-right-length 100

unbind C-b
set-option -g prefix M-,
bind-key M-, send-prefix

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'M-j' if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'M-k' if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'M-l' if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi 'M-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'M-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'M-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'M-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Space send-keys -X rectangle-toggle 
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -n M-g previous-window
bind-key -n M-\; next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-s split-window -v -c "#{pane_current_path}"
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-w break-pane
bind-key -n 'M-G' 'swap-window -d -t -1'
bind-key -n 'M-:' 'swap-window -d -t +1'
bind-key -n 'C-M-h' 'select-pane -m; select-pane -L; swap-pane; select-pane -L; select-pane -M;' 
bind-key -n 'C-M-j' 'select-pane -m; select-pane -D; swap-pane; select-pane -D; select-pane -M;' 
bind-key -n 'C-M-k' 'select-pane -m; select-pane -U; swap-pane; select-pane -U; select-pane -M;' 
bind-key -n 'C-M-l' 'select-pane -m; select-pane -R; swap-pane; select-pane -R; select-pane -M;' 
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind-key -n M-q kill-pane
bind-key -n M-Enter new-window
bind-key -n M-Q kill-window
bind-key -n M-t run-shell "sesh connect \"$(
    sesh list -t -c --icons | fzf-tmux -p 80%,70% \
        --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
        --delimiter '\t' --with-nth 1 \
        --header ' ^a all ^t tmux ^g configs ^d kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list -t -c --icons)' \
        --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
        --bind 'ctrl-f:change-prompt(🔎 )+reload(~/.config/sesh/scripts/find-dirs.sh)' \
        --bind 'ctrl-d:execute-silent(echo {1} | cut -d\" \" -f2- | xargs -I@ tmux kill-session -t @)+change-prompt(⚡ )+reload(sesh list -t -c --icons)' \
        --preview-window 'right:55%' \
        --preview 'sesh preview {-1}' \
    | awk -F'\t' '{print \$NF}'
)\""
bind-key -r D run-shell "sesh connect dotfiles"
bind-key -r S run-shell "sesh connect spotify"
bind-key -r P run-shell "sesh connect personal"
bind-key -r Q run-shell "sesh connect quickterm"

bind-key -n M-a switch-client -T snyk-repos
bind-key -T snyk-repos c run-shell "sesh connect cli"
bind-key -T snyk-repos l run-shell "sesh connect snyk-ls"
bind-key -T snyk-repos g run-shell "sesh connect go-application-framework"
bind-key -T snyk-repos a run-shell "sesh connect analytics-service"
bind-key -T snyk-repos x run-shell "sesh connect ldx-sync"

bind-key -T snyk-repos v run-shell "sesh connect vscode-extension"
bind-key -T snyk-repos e run-shell "sesh connect snyk-eclipse-plugin"
bind-key -T snyk-repos s run-shell "sesh connect snyk-visual-studio-plugin"
bind-key -T snyk-repos j run-shell "sesh connect snyk-intellij-plugin"

bind-key -n M-r command-prompt "rename-session '%%'"
bind-key -n M-p run-shell "sesh last"
bind-key -n M-x run "tmux switch-client -l || tmux switch-client -p" \; kill-session


bind-key -n M-f resize-pane -Z
bind-key -n M-Escape copy-mode
bind-key -n M-R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "tmux.conf reloaded."

set -g detach-on-destroy off # don't exit from tmux when closing a session

# Mouse support
set -g mouse on
set-option -wg main-pane-width 50%
set-option -wg main-pane-height 50%

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
