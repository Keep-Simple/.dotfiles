# Defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'catppuccin/tmux'
set -g @fingers-enable-bindings 0
set -g @fingers-main-action 'sh -c ~/.local/bin/fingers-copy'
set -g @fingers-use-system-clipboard 1
set -g @fingers-hint-position left
set -s set-clipboard external

# fix color
set -ag terminal-overrides ",$TERM:RGB"

set-option -g default-shell /bin/zsh
set-option -g default-command 'zsh'
# set -g default-terminal "xterm-kitty"

# Catppuccin Mocha (config must precede `run tpm`)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Show pane title (#T) when app sets it (e.g. "✳ Claude Code"); else window name (#W = cmd)
# Fall back to #W when title is empty (e.g. yazi clears it) or matches hostname
# Rename "Claude Code" → "claude" in displayed title
set -g @catppuccin_window_text ' #{?#{||:#{m:#H*,#{pane_title}},#{==:#{pane_title},}},#W,#{s/Claude Code/claude/:#{pane_title}}}'
set -g @catppuccin_window_current_text ' #{?#{||:#{m:#H*,#{pane_title}},#{==:#{pane_title},}},#W,#{s/Claude Code/claude/:#{pane_title}}}'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_flags_icon_current ''
set -g @catppuccin_window_flags_icon_last ''

unbind C-b
set-option -g prefix M-,
bind-key M-, send-prefix

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'M-j' if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'M-k' if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'M-l' if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi 'M-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'M-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'M-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'M-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

set-window-option -g mode-keys vi
# Hide non-current search match highlight (current match still styled).
set -g copy-mode-match-style 'default'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Space send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "perl -0pe 's/\\A\\s+|\\s+\\z//g' | pbcopy"
# Inside Claude pane (no OSC 133), search Claude's line markers instead.
is_claude="#{m/ri:claude,#{pane_title}}"
bind-key -T copy-mode-vi '[' if-shell -F "$is_claude" \
  { send-keys -X search-backward '^❯ ' } \
  { send-keys -X previous-prompt }
bind-key -T copy-mode-vi ']' if-shell -F "$is_claude" \
  { send-keys -X search-forward  '^❯ ' } \
  { send-keys -X next-prompt }
bind-key -T copy-mode-vi '{' if-shell -F "$is_claude" \
  { send-keys -X search-backward '^⏺ ' } \
  { send-keys -X previous-prompt -o }
bind-key -T copy-mode-vi '}' if-shell -F "$is_claude" \
  { send-keys -X search-forward  '^⏺ ' } \
  { send-keys -X next-prompt -o }
bind-key -n M-g previous-window
bind-key -n M-\; next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-s split-window -v -c "#{pane_current_path}"
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-w break-pane
bind-key -n 'M-G' 'swap-window -d -t -1'
bind-key -n 'M-:' 'swap-window -d -t +1'
bind-key -n 'C-M-h' 'select-pane -m; select-pane -L; swap-pane; select-pane -L; select-pane -M;' 
bind-key -n 'C-M-j' 'select-pane -m; select-pane -D; swap-pane; select-pane -D; select-pane -M;' 
bind-key -n 'C-M-k' 'select-pane -m; select-pane -U; swap-pane; select-pane -U; select-pane -M;' 
bind-key -n 'C-M-l' 'select-pane -m; select-pane -R; swap-pane; select-pane -R; select-pane -M;' 
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind-key -n M-q kill-pane
bind-key -n M-Enter new-window
bind-key -n M-Q kill-window
bind-key -n M-t run-shell "sesh connect \"$(
    { sesh list -t -c --icons; ~/.config/sesh/scripts/find-dirs.sh; } | fzf-tmux -p 80%,70% \
        --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
        --delimiter '\t' --with-nth 1 \
        --header ' ^a all ^t tmux ^g configs ^d kill' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list -t -c --icons; ~/.config/sesh/scripts/find-dirs.sh)' \
        --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
        --bind 'ctrl-d:execute-silent(echo {1} | cut -d\" \" -f2- | xargs -I@ tmux kill-session -t @)+change-prompt(⚡ )+reload(sesh list -t -c --icons; ~/.config/sesh/scripts/find-dirs.sh)' \
        --preview-window 'right:55%' \
        --preview 'sesh preview {-1}' \
    | awk -F'\t' '{print \$NF}'
)\""
bind-key -r D run-shell "sesh connect dotfiles"
bind-key -r S run-shell "sesh connect spotify"
bind-key -r P run-shell "sesh connect personal"
bind-key -r Q run-shell "sesh connect quickterm"

bind-key -n M-a switch-client -T snyk-repos
run 'for r in c:cli l:snyk-ls g:go-application-framework a:analytics-service \
              x:ldx-sync v:vscode-extension e:snyk-eclipse-plugin \
              s:snyk-visual-studio-plugin j:snyk-intellij-plugin; do \
       tmux bind-key -T snyk-repos "${r%%:*}" run-shell "sesh connect ${r#*:}"; \
     done'

bind-key -n M-r command-prompt "rename-session '%%'"
bind-key -n M-p switch-client -l
bind-key -n M-x run "tmux switch-client -l || tmux switch-client -p" \; kill-session


bind-key -n M-f resize-pane -Z
bind-key -n M-Escape copy-mode
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'
bind-key -n M-e run-shell -b "${TMUX_PLUGIN_MANAGER_PATH}tmux-jump/scripts/tmux-jump.sh"
bind-key -n M-y run-shell -b "tmux-fingers start '#{pane_id}'"
bind-key -n M-R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "tmux.conf reloaded."

set -g detach-on-destroy off # don't exit from tmux when closing a session

# Mouse support
set -g mouse on
set-option -wg main-pane-width 50%
set-option -wg main-pane-height 50%

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Catppuccin status (must run AFTER tpm so @thm_* vars exist)
set-option -g status-position top
set-option -g status-justify left
set-option -g status-left ""
set-option -g status-right "#{E:@catppuccin_status_session}"
set-option -g status-right-length 100
