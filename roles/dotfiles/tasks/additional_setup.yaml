---
- name: Symlink project overrides
  ansible.builtin.include_tasks: project_overrides.yaml
  tags: ['dotfiles']

# .gitconfig includes ~/.gitconfig-zscaler unconditionally; git ignores the
# include when the file is absent. Write it only where the bundle it names
# actually exists, so a fresh machine is not left with a broken http.sslCAInfo.
- name: Stat the Zscaler CA bundle
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/zscaler-ca-bundle.pem"
  register: zscaler_bundle
  tags: ['dotfiles']

# Written unconditionally so that removing the bundle also removes the setting.
# A `when:` here would leave the old file behind and put http.sslCAInfo back on
# a path that no longer exists.
- name: Point git at the Zscaler CA bundle
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.gitconfig-zscaler"
    mode: '0644'
    content: |
      # Managed by ansible (dotfiles).
      {% if zscaler_bundle.stat.exists %}
      [http]
      	sslCAInfo = {{ zscaler_bundle.stat.path }}
      {% endif %}
  tags: ['dotfiles']

- name: Stat tmux plugin manager
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm/.git"
  register: tpm_repo
  tags: ['bootstrap']

- name: Install tmux plugin manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm"
    update: false
  when: not tpm_repo.stat.exists
  tags: ['bootstrap']

- name: Register tpm plugins
  stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/tmux/plugins"
  register: tpm_plugins
  tags: ['bootstrap']

- name: Install tpm plugins
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm/bin/install_plugins"
  when: not tpm_plugins.stat.exists
  tags: ['bootstrap']

- name: Install pre-commit hooks in dotfiles repo
  ansible.builtin.command:
    cmd: pre-commit install
    chdir: "{{ dotfiles.target }}"
    creates: "{{ dotfiles.target }}/.git/hooks/pre-commit"
  environment:
    PATH: "{{ homebrew_brew_bin_path | default('') }}:{{ ansible_facts['env'].PATH }}"
  tags: ['bootstrap']

- name: Install asdf packages
  ansible.builtin.shell: |
    set -o pipefail
    awk '{print $1}' {{ ansible_facts['user_dir'] }}/.tool-versions | xargs -I _ asdf plugin add _ || true
    asdf install
  args:
    chdir: "{{ ansible_facts['user_dir'] }}"
    executable: /bin/bash
  register: asdf_result
  changed_when: >
    'The installation was successful!' in asdf_result.stdout
  failed_when: false
  tags: ['bootstrap']

- name: Install agent skills
  ansible.builtin.shell: |
    npx skills@latest add {{ item.repo }} -s {% for s in item.skills.split(',') %}'{{ s }}' {% endfor %}-a {{ skill_agents }} -g -y
  args:
    executable: /bin/bash
  loop: "{{ agent_skills }}"
  failed_when: false
  tags: ['bootstrap']

- name: Allow model invocation for unslop
  ansible.builtin.shell: |
    f="{{ ansible_facts['user_dir'] }}/.claude/skills/unslop/SKILL.md"
    if [ -f "$f" ] && grep -q '^disable-model-invocation:' "$f"; then
      perl -ni -e 'print unless /^disable-model-invocation:/' "$f"
      echo flipped
    fi
  args:
    executable: /bin/bash
  register: unslop_flip
  changed_when: "'flipped' in unslop_flip.stdout"
  failed_when: false
  tags: ['bootstrap']

- name: Update tmux plugins (async)
  ansible.builtin.shell: |
    set -o pipefail
    {
      git -C "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm" pull --ff-only
      "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm/bin/update_plugins" all
      "{{ ansible_facts['user_dir'] }}/.local/bin/tmux-reload"
    } 2>&1 | tee {{ update_log_dir }}/tpm.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: tpm_async
  tags: ['update', 'never']

- name: Update asdf plugins (async)
  ansible.builtin.shell: |
    set -o pipefail
    asdf plugin list | xargs -n1 -P8 -I{} asdf plugin update {} 2>&1 | tee {{ update_log_dir }}/asdf.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: asdf_async
  tags: ['update', 'never']

- name: Update agent skills (async)
  ansible.builtin.shell: |
    set -o pipefail
    skills_dir="{{ ansible_facts['user_dir'] }}/.claude/skills"
    before=$(ls -1 "$skills_dir" 2>/dev/null | sort)
    {
      {% for item in agent_skills %}
      npx skills@latest add {{ item.repo }} -s {% for s in item.skills.split(',') %}'{{ s }}' {% endfor %}-a {{ skill_agents }} -g -y
      {% endfor %}
      npx skills@latest update --yes -g
      if [ -f "$skills_dir/unslop/SKILL.md" ]; then
        perl -ni -e 'print unless /^disable-model-invocation:/' "$skills_dir/unslop/SKILL.md"
      fi
    } 2>&1 | tee {{ update_log_dir }}/skills.log
    after=$(ls -1 "$skills_dir" 2>/dev/null | sort)
    list_clean=$(npx skills@latest list -g 2>/dev/null | sed $'s/\x1b\\[[0-9;]*m//g')
    {
      echo "---SKILL-DIFF---"
      while IFS= read -r name; do
        [ -z "$name" ] && continue
        desc=$(sed -n 's/^description:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$skills_dir/$name/SKILL.md" 2>/dev/null | head -1)
        source=$(printf '%s\n' "$list_clean" | awk -v n="$name" '
          /^  [^ ]/ { cur=$1 }
          cur==n && /Source:/ { sub(/.*Source: */,""); print; exit }
        ')
        printf 'skill-diff: added %s\t%s\t%s\n' "$name" "${source:-unknown}" "${desc:-}"
      done < <(comm -13 <(echo "$before") <(echo "$after"))
      comm -23 <(echo "$before") <(echo "$after") | sed 's/^/skill-diff: removed /'
    } >> {{ update_log_dir }}/skills.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: skills_async
  tags: ['update', 'never']

- name: Update yazi plugins (async)
  ansible.builtin.shell: |
    set -o pipefail
    "{{ ansible_facts['user_dir'] }}/.local/bin/yazi-update" 2>&1 | tee {{ update_log_dir }}/yazi.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: yazi_async
  tags: ['update', 'never']

- name: Update claude code plugins (async)
  ansible.builtin.shell: |
    set -o pipefail
    # Serial (no -P): concurrent `claude plugin update` invocations race on the
    # shared marketplace git dir, producing flaky `unknown` versions and
    # occasional half-cloned states. Slower (~4x) but reliable.
    claude plugin list --json | jq -r '.[].id' | xargs -n1 -I{} claude plugin update {} 2>&1 | tee {{ update_log_dir }}/claude.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: claude_async
  tags: ['update', 'never']
