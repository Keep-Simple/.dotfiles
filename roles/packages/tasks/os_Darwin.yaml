---
- name: Register Brewfile
  stat:
    path: "{{ dotfiles.target }}/roles/packages/files/macos/Brewfile"
  register: brew_file

- block:
    # Homebrew ignores untrusted third-party taps, so this must run before any resolution.
    - name: Trust Brewfile taps
      ansible.builtin.shell: |
        set -o pipefail
        grep '^tap ' {{ brew_file.stat.path | quote }} \
          | sed -E 's/^tap "([^"]+)".*/\1/' \
          | xargs {{ homebrew_brew_bin_path }}/brew trust --tap
      args:
        executable: /bin/bash
      register: brew_trust
      changed_when: "'Trusted tap:' in brew_trust.stdout"

    - name: Check if install is needed
      command: "{{ homebrew_brew_bin_path }}/brew bundle check chdir={{ brew_file.stat.path | dirname }}"
      register: brew_check
      changed_when: false
      failed_when: false

    - name: Install with passwordless sudo
      block:
        - name: allow passwordless sudo
          lineinfile:
            path: /etc/sudoers
            line: 'ALL ALL=(ALL) NOPASSWD: ALL'
          become: true

        - name: Install from Brewfile
          command: "{{ homebrew_brew_bin_path }}/brew bundle chdir={{ brew_file.stat.path | dirname }}"
          async: 100000
          poll: 5

      always:
        - name: disable passwordless sudo
          lineinfile:
            path: /etc/sudoers
            line: 'ALL ALL=(ALL) NOPASSWD: ALL'
            state: absent
          become: true
      when: brew_check.rc == 1
  when: brew_file.stat.exists

- name: Update homebrew packages (async)
  ansible.builtin.shell: |
    set -o pipefail
    {
      {{ homebrew_brew_bin_path }}/brew update
      {{ homebrew_brew_bin_path }}/brew upgrade
      {{ homebrew_brew_bin_path }}/brew upgrade --cask
      {{ homebrew_brew_bin_path }}/brew cleanup
    } 2>&1 | tee {{ update_log_dir }}/brew.log
  args:
    executable: /bin/bash
  async: 1800
  poll: 0
  register: brew_async
  tags: ['update', 'never']
